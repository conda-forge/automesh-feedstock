{% set name = "automesh" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d8b93e9d040ecaffc7f8e49bff5e3b0e3ac3061dcf2eeeff658f6443597be7c5

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses
    - cmake
    - make
    - pkg-config
  host:
    - libnetcdf
    - maturin
    - pip
    - python
  run:
    - python

test:
  commands:
    - pip check
  imports:
    - automesh
  requires:
    - pip

about:
  home: https://autotwin.github.io/automesh
  description: Automatic mesh generation.
  dev_url: https://github.com/autotwin/automesh
  license: GPL-2.0-or-later
  license_file:
    - THIRDPARTY.yml
    - LICENSE
  summary: Automatic mesh generation.

extra:
  recipe-maintainers:
    - mrbuche
    - hovey
